# Minimal setup: run the metadata server, then point Lidarr at it with
# ./switch.sh --lidarr http://lidarr:8686 --api-key <key> --to http://metadata:5001/
services:
  metadata:
    image: ghcr.io/nc1107/lidarr-metadata-provider:latest
    container_name: lidarr-metadata-provider
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      # The dataset lives here and survives image updates.
      - lidarr-metadata:/data
    environment:
      # On first boot the server downloads this dataset, verifies it against
      # its published checksum, and serves it. After that it works offline.
      # "latest" always resolves to the newest published dataset, so a fresh
      # volume picks up current data without editing this file.
      - LMP_DATASET_URL=https://github.com/NC1107/lidarr-metadata-provider/releases/latest/download/dataset.db
      # Live MusicBrainz lookups for releases too new to be in the dataset,
      # and the musicbrainz column in the /ui console. The contact identifies
      # your instance to MusicBrainz and is required by them, not by us; a
      # URL works as well as an email.
      # - LMP_FALLBACK=true
      # - LMP_CONTACT=https://github.com/NC1107/lidarr-metadata-provider
      #
      # Uncomment to keep the dataset current on its own. Off by default because
      # each update is the full ~8GB artifact; with it set, the server checks
      # this often and swaps in a newer dataset when one is published (new
      # datasets land twice a week), live, without a restart. Needs room for a
      # second copy of the dataset while the new one downloads.
      # - LMP_DATASET_REFRESH=72h
      #
      # Every flag has an LMP_ environment variable (LMP_ADDR, LMP_WEB, ...);
      # see README.md. There is no need to override the command.

volumes:
  lidarr-metadata:
