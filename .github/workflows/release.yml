# Builds native server binaries for every supported OS and architecture and
# attaches them to a GitHub release, for people who would rather run the binary
# than the container. Triggered by a version tag; image.yml publishes the
# matching container on the same tag.
#
# Cross-compiling to all targets is a plain `go build` here because the sqlite
# driver is pure Go (modernc.org/sqlite) and the build runs with CGO off, so
# there is no cross toolchain to wrangle.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # The server is the deliverable; the dataset-building pipeline stays in
          # the container for the few who need it (see docs/BUILDING.md).
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            out="dist/lidarr-metadata-provider_${os}_${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/lidarr-metadata-provider
          done
          ( cd dist && sha256sum * > checksums.txt )
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
